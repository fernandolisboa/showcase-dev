# Run Traefik locally in front of booted Sessions (ADR-0004/0009).
#
# 1. Start the control plane on the host, reachable from this container over the
#    Docker bridge gateway. The control-plane internal listeners default to
#    127.0.0.1 (so no Session can reach them in prod), so dev binds them to the
#    gateway instead:
#        INTERNAL_HOST=0.0.0.0 INTERNAL_PORT=8081 SPLASH_PORT=8082 make run
# 2. Start Traefik:                          make proxy-up
# 3. Boot a Session whose Runner is wired with WithProxy(registry, "showcase-traefik").
#    It is then reachable at  http://s-<id>.run.localhost
#    (*.localhost resolves to 127.0.0.1 in modern browsers and curl).
#
# The dashboard (:8080) is intentionally NOT published: api.insecure leaks every
# Session's backend map to any container on the network (ADR-0004). Inspect routers
# with `curl http://host.docker.internal:8081/traefik` from the host instead.
#
# The container_name below must match the name the Runner attaches to each
# Session network (WithProxy's traefikContainer argument).
services:
  traefik:
    image: traefik:v3.7
    container_name: showcase-traefik
    command: ["--configFile=/etc/traefik/traefik.yml"]
    networks:
      # Pin Traefik to a static IP on its OWN network. The Runner attaches Traefik
      # to each Session network at boot (compose.go attachProxy), AFTER this socket
      # is bound — and the metrics entryPoint binds to this IP (traefik.yml), a NIC
      # no Session is ever on, so a Session container can't reach :8084 (#27). The
      # host-loopback publish below DNATs to this same IP (set at start, when only
      # this network is attached), so the control-plane scrape is unchanged.
      proxy:
        ipv4_address: 192.168.218.10
    ports:
      - "80:80"
      # Prometheus metrics, bound to host loopback so only the control plane on the
      # host scrapes them (the idle signal for session teardown, ADR-0006) — not
      # published to any public or Session-reachable interface. The container-side
      # listener is further pinned to the proxy-network IP above (traefik.yml).
      - "127.0.0.1:8084:8084"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
    extra_hosts:
      # Lets Traefik reach the control plane running on the host (Linux + Desktop).
      - "host.docker.internal:host-gateway"

networks:
  # Traefik's own bridge, with a fixed subnet so the metrics entryPoint can bind a
  # known IP (192.168.218.10). Sessions are never attached to this network — they
  # get their own per-Session bridges — so this IP is unreachable from a Session.
  #
  # DEPLOY PRECONDITION: 192.168.218.0/24 must not overlap any existing route on
  # the host — Docker's default pool (172.x, avoided here), another compose project,
  # a corporate/WSL VPN route, or the prod VNet (ADR-0009's Azure VM). On overlap,
  # `compose up` fails closed with a pool-overlap error (it does NOT weaken the
  # isolation). To relocate, move this subnet AND the coupled metrics address in
  # traefik.yml together.
  proxy:
    name: showcase-proxy
    ipam:
      config:
        - subnet: 192.168.218.0/24
