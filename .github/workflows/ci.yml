name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go — vet, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go vet ./cmd/... ./internal/...
      - run: go test -race ./cmd/... ./internal/...
      - run: go build ./cmd/... ./internal/...

  integration:
    name: Runner + session integration (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      # ubuntu-latest ships a running Docker daemon; these tests boot real Sessions
      # under runc and a real Traefik (#27 — an extra image pull + readiness wait);
      # gVisor/runsc is verified on the VM, not in CI. The serial boots are why the
      # wall budget is 600s.
      - run: go test -tags integration -timeout 600s ./internal/runner/... ./internal/session/... ./internal/store/...

  integration-builder:
    name: Builder sandbox integration (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      # The build sandbox (#31/ADR-0010) runs untrusted builds in rootless BuildKit,
      # which needs /dev/fuse (present on ubuntu-latest). Its adversarial boundary
      # tests are the gate #19 depends on, so they run in their own job with their
      # own 600s budget. Pre-pull the heavy images so that budget is spent on the
      # cold (cacheless) sandboxed builds, not on image pulls.
      - run: |
          for img in moby/buildkit:rootless alpine:3.21 traefik/whoami curlimages/curl:latest postgres:17; do
            docker pull -q "$img"
          done
      - run: go test -tags integration -timeout 600s ./internal/builder/...

  web:
    name: Web — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  binary:
    name: Full binary — UI embedded into the Go build
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: make build
      - run: test -x bin/controlplane
